services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ${DATA_DIR:-./data}:/config
    networks:
      - media
      - traefik_proxy

networks:
  media:
    name: media
    external: true
  traefik_proxy:
    name: traefik_proxy
    external: true
