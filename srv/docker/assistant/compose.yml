services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.5.1
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${DATA_DIR:-./data}:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
