services:
  # -------------------------------------------------------------
  # 1. High-Performance Go Engine (Whatomate WhatsApp Webhook)
  # -------------------------------------------------------------
  autorox-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: autorox-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8000
      - DB_PATH=/app/data/live/inventory.db
      - WHATOMATE_URL=${WHATOMATE_URL:-http://whatomate_app:8080}
      - WHATOMATE_KEY=${WHATOMATE_API_KEY:-}
      - OCR_URL=http://autorox-ocr:8005
    networks:
      - autorox-net
      - traefik_proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 2. GPU-Accelerated OCR Service (GTX 1050 Mobile / EasyOCR)
  # -------------------------------------------------------------
  autorox-ocr:
    profiles: ["ocr"]
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: autorox-ocr
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - ./data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DB_PATH=/app/data/live/inventory.db
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - autorox-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 3. Python Domain Worker (AutoRox ERP Sync & Token Cache)
  # -------------------------------------------------------------
  autorox-sync:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: autorox-sync
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - AUTOROX_USERNAME=${AUTOROX_USERNAME:-whatomate}
      - AUTOROX_PASSWORD=${AUTOROX_PASSWORD}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-60}
      - OUTPUT_DIR=/app/data/live
    networks:
      - autorox-net
    depends_on:
      - autorox-engine

networks:
  autorox-net:
    name: autorox-network
    driver: bridge
  traefik_proxy:
    name: traefik_proxy
    external: true
